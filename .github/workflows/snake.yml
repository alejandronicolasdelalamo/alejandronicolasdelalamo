# Genera la animación de la serpiente que se come las contribuciones
# y la publica en la rama "output". Se ejecuta cada día y a mano.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F5AF0&color_dots=#ebedf0,#c9c2ff,#a08cff,#7F5AF0,#5B3FD6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2CB1BC&color_dots=#161b22,#2b2560,#4a3aa8,#6c55e0,#7F5AF0

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
